name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  audit:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

    - name: Install golint
      run: go install golang.org/x/lint/golint@latest

    - name: Run golint
      run: golint ./...

    - name: Run tests
      run: go test -race -vet=off -coverprofile=./coverage.out ./...

    - name: Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: rezakhademix/govalidator

  dependencies:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        directory: ['.', 'benchmarks']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        cache-dependency-path: ${{ matrix.directory }}/go.sum

    - name: Verify dependencies
      run: go mod verify

    - name: Test
      run: go test -race ./...

    - name: Exercise benchmarks
      run: go test -run='^$' -bench=. -benchtime=1x ./...

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

    - name: Check dependency packages for vulnerabilities
      run: govulncheck -scan package all
